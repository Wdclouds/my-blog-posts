name: Build and Deploy Blog Database

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compile Markdown to SQLite
        run: npm run build

      - name: Deploy blog.sqlite to Aliyun ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/blog.sqlite"
          target: "/opt/netcatty-apps/my-site-data/blog/"
          strip_components: 1
          overwrite: true
